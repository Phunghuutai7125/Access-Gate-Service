openapi: 3.1.0
info:
  title: Smart Campus — Access Gate Service API
  version: 1.0.0
  description: |
    Access Gate Service phụ trách quản lý kiểm soát ra/vào tại các Barrier/Cổng trong Smart Campus Operations Platform.
    Service nhận sự kiện quẹt thẻ RFID (`POST /access/swipe`), gọi đồng bộ sang Core Business (`POST /access/check`)
    để thẩm định chính sách theo cơ chế Fail-closed, ghi nhận nhật ký vào cơ sở dữ liệu PostgreSQL,
    đồng thời publish event bất đồng bộ sang Analytics Service qua MQTT và cung cấp REST API cho Core Business audit.
  contact:
    name: Access Gate API Team
    email: access-gate@campus.local
servers:
  - url: http://localhost:8000
    description: Local Docker / Development Server
  - url: https://api.campus.local
    description: Production API Server
tags:
  - name: access
    description: Nghiệp vụ quẹt thẻ tại cổng và barrier
  - name: access-logs
    description: Truy vấn và audit nhật ký ra/vào
  - name: gates
    description: Giám sát trạng thái phần cứng cổng
  - name: cards
    description: Quản lý và đăng ký thẻ RFID
  - name: health
    description: Giám sát trạng thái dịch vụ

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Kiểm tra trạng thái service
      description: Endpoint kiểm tra liveness/readiness của dịch vụ.
      tags: [health]
      security: []
      responses:
        '200':
          description: Service hoạt động bình thường
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                service: access-gate-service
                time: '2026-08-11T11:37:00Z'

  /access/swipe:
    post:
      operationId: swipeCard
      summary: Nhận sự kiện quẹt thẻ RFID tại Barrier
      description: |
        Được gọi khi người dùng quẹt thẻ tại Barrier hoặc từ RFID Reader.
        Service sẽ:
          1. Gọi sang Core Business (`POST /access/check`) để kiểm tra quyền.
          2. Xử lý Fail-closed nếu Core Business lỗi hoặc timeout (>1.5s).
          3. Ghi log vào cơ sở dữ liệu PostgreSQL.
          4. Cập nhật trạng thái cổng (`OPEN` hoặc `CLOSED`).
          5. Publish event sang Analytics Service qua MQTT (`access.events`).
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwipeRequest'
            example:
              cardId: RFID-2026-001
              gateId: GATE-01
              direction: IN
      responses:
        '200':
          description: Kết quả xử lý quẹt thẻ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwipeResponse'
              example:
                logId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                cardId: RFID-2026-001
                gateId: GATE-01
                direction: IN
                accessGranted: true
                result: ALLOW
                reasonCode: VALID_CARD
                decisionId: 0196fb3d-4ad7-7d1e-9f49-bbb148d2b002
                policyId: POL-001
                decisionSource: CORE
                timestamp: '2026-08-11T07:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /access/logs/recent:
    get:
      operationId: listRecentAccessLogs
      summary: Lấy danh sách log ra/vào gần nhất
      description: |
        Core Business gọi endpoint này để audit log ra/vào.
        Hỗ trợ lọc theo mã cổng (`gateId`), khoảng thời gian (`startTime`, `endTime`), và phân trang.
      tags: [access-logs]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/GateIdFilter'
        - name: startTime
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Lọc log từ thời điểm này (ISO 8601)
        - name: endTime
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Lọc log đến thời điểm này (ISO 8601)
      responses:
        '200':
          description: Danh sách log ra/vào
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /access/logs/{logId}:
    get:
      operationId: getAccessLogById
      summary: Lấy chi tiết một log ra/vào
      description: Tra cứu chi tiết một bản ghi quẹt thẻ theo `logId`.
      tags: [access-logs]
      parameters:
        - $ref: '#/components/parameters/LogId'
      responses:
        '200':
          description: Chi tiết log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /gates/{gateId}/status:
    get:
      operationId: getGateStatus
      summary: Lấy trạng thái cổng
      description: Kiểm tra trạng thái hiện tại của cổng Barrier (`OPEN`/`CLOSED`).
      tags: [gates]
      parameters:
        - $ref: '#/components/parameters/GateId'
      responses:
        '200':
          description: Trạng thái cổng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /cards/{cardId}:
    get:
      operationId: getCardById
      summary: Tra cứu thông tin thẻ RFID
      description: Lấy thông tin chi tiết về chủ sở hữu và trạng thái thẻ.
      tags: [cards]
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Thông tin thẻ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /cards:
    post:
      operationId: registerCard
      summary: Đăng ký thẻ mới
      description: Đăng ký thẻ sinh viên (STUDENT) hoặc nhân viên (STAFF) vào hệ thống.
      tags: [cards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCardRequest'
      responses:
        '201':
          description: Đăng ký thẻ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    LogId:
      name: logId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GateId:
      name: gateId
      in: path
      required: true
      schema:
        type: string
        pattern: '^GATE-[0-9]{2}$'
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        pattern: '^RFID-[0-9]{4}-[0-9]{3}$'
    GateIdFilter:
      name: gateId
      in: query
      required: false
      schema:
        type: string
        pattern: '^GATE-[0-9]{2}$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: [string, 'null']
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    HealthStatus:
      type: object
      required: [status, service, time]
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: access-gate-service }
        time: { type: string, format: date-time }

    SwipeRequest:
      type: object
      required: [cardId, gateId, direction]
      properties:
        cardId:
          type: string
          pattern: '^RFID-[0-9]{4}-[0-9]{3}$'
          example: RFID-2026-001
        gateId:
          type: string
          pattern: '^GATE-[0-9]{2}$'
          example: GATE-01
        direction:
          type: string
          enum: [IN, OUT]
          example: IN

    SwipeResponse:
      type: object
      required: [logId, cardId, gateId, direction, accessGranted, result, reasonCode, timestamp]
      properties:
        logId: { type: string, format: uuid }
        cardId: { type: string }
        gateId: { type: string }
        direction: { type: string, enum: [IN, OUT] }
        accessGranted: { type: boolean }
        result: { type: string, enum: [ALLOW, DENY] }
        reasonCode: { type: string }
        decisionId: { type: [string, 'null'] }
        policyId: { type: [string, 'null'] }
        decisionSource: { type: string, example: CORE }
        timestamp: { type: string, format: date-time }

    AccessLog:
      type: object
      required: [logId, cardId, gateId, direction, status, reasonCode, timestamp]
      properties:
        logId: { type: string, format: uuid }
        cardId: { type: string }
        gateId: { type: string }
        direction: { type: string, enum: [IN, OUT] }
        status: { type: string, enum: [GRANTED, DENIED] }
        reasonCode: { type: string }
        decisionId: { type: [string, 'null'] }
        operatorNote: { type: [string, 'null'] }
        timestamp: { type: string, format: date-time }

    AccessLogPage:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessLog'
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }

    GateStatus:
      type: object
      required: [gateId, state, updatedAt]
      properties:
        gateId: { type: string }
        state: { type: string, enum: [OPEN, CLOSED, FAULT] }
        lastCardId: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }

    Card:
      type: object
      required: [cardId, personId, cardType, status]
      properties:
        cardId: { type: string }
        personId: { type: string }
        cardType: { type: string, enum: [STUDENT, STAFF, VISITOR] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        issuedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }

    RegisterCardRequest:
      type: object
      required: [cardType, cardId, personId]
      properties:
        cardType: { type: string, enum: [STUDENT, STAFF] }
        cardId: { type: string, pattern: '^RFID-[0-9]{4}-[0-9]{3}$' }
        personId: { type: string }
        studentCode: { type: string }
        department: { type: string }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        errors: { type: array, items: { type: object } }

  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Chưa xác thực Bearer token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Tài nguyên không tìm thấy
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Xung đột dữ liệu (ví dụ thẻ đã tồn tại)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalServerError:
      description: Lỗi máy chủ nội bộ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
